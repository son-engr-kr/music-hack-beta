[project]
name = "music-hack-beta"
version = "0.1.0"
description = "Live AI music instruments built with Magenta RealTime 2"
requires-python = ">=3.12"
dependencies = [
    "magenta-rt[mlx]>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mlx==0.30.6",
    "python-multipart>=0.0.32",
]

[project.scripts]
music-hack-beta = "music_hack_beta.cli:cli"
music-hack-beta-server = "music_hack_beta.server:main"
mrt2-jam = "music_hack_beta.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_hack_beta"]
